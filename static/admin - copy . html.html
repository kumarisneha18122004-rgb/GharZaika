<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GharZaika Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #222;
        }

        header {
            background: #ff6b35;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        header a {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 10px 16px;
            border-radius: 8px;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #666;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 30px;
            font-weight: bold;
            color: #ff6b35;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .section h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .full {
            grid-column: 1 / -1;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .add-btn {
            background: #28a745;
            color: white;
        }

        .update-btn {
            background: #007bff;
            color: white;
        }

        .cancel-btn {
            background: #6c757d;
            color: white;
        }

        .edit-btn {
            background: #007bff;
            color: white;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .availability-btn {
            background: #17a2b8;
            color: white;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #f8f9fa;
        }

        .available {
            color: green;
            font-weight: bold;
        }

        .unavailable {
            color: red;
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        #cancelEditBtn {
            display: none;
        }

        #message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 800px) {

            .dashboard-cards {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>🍽️ GharZaika Admin Dashboard</h1>

    <a href="/">← Customer Website</a>

</header>


<div class="container">


    <!-- DASHBOARD CARDS -->

    <div class="dashboard-cards">

        <div class="card">
            <h3>Total Food Items</h3>
            <p id="totalFoods">0</p>
        </div>

        <div class="card">
            <h3>Available Items</h3>
            <p id="availableFoods">0</p>
        </div>

        <div class="card">
            <h3>Unavailable Items</h3>
            <p id="unavailableFoods">0</p>
        </div>

    </div>


    <!-- FOOD FORM -->

    <div class="section">

        <h2 id="formTitle">➕ Add New Food</h2>

        <div id="message"></div>

        <div class="form-grid">

            <input
                type="text"
                id="foodName"
                placeholder="Food Name"
            >

            <input
                type="number"
                id="foodPrice"
                placeholder="Price"
                min="0"
                step="0.01"
            >

            <select id="foodCategory">

                <option value="">Select Category</option>

                <option value="Main Course">
                    Main Course
                </option>

                <option value="Snacks">
                    Snacks
                </option>

                <option value="Chinese">
                    Chinese
                </option>

                <option value="Dessert">
                    Dessert
                </option>

                <option value="Beverages">
                    Beverages
                </option>

            </select>

            <select id="foodAvailable">

                <option value="true">
                    Available
                </option>

                <option value="false">
                    Unavailable
                </option>

            </select>

            <textarea
                id="foodDescription"
                class="full"
                placeholder="Food Description"
            ></textarea>

            <div class="full">

                <button
                    id="saveBtn"
                    class="add-btn"
                    onclick="saveFood()"
                >
                    ➕ Add Food
                </button>

                <button
                    id="cancelEditBtn"
                    class="cancel-btn"
                    onclick="cancelEdit()"
                >
                    Cancel Edit
                </button>

            </div>

        </div>

    </div>


    <!-- FOOD LIST -->

    <div class="section">

        <h2>🍴 Food Management</h2>

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Price</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="foodTableBody">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

    let foods = [];

    let editingFoodId = null;


    // ==========================================
    // LOAD FOODS
    // ==========================================

    async function loadFoods() {

        try {

            const response = await fetch("/api/foods/all");

            const data = await response.json();

            if (!response.ok) {

                throw new Error(
                    data.detail || "Could not load foods."
                );

            }

            foods = data;

            displayFoods();

            updateDashboard();

        } catch (error) {

            showMessage(
                error.message,
                "error"
            );

        }

    }


    // ==========================================
    // DISPLAY FOODS
    // ==========================================

    function displayFoods() {

        const tbody =
            document.getElementById(
                "foodTableBody"
            );

        tbody.innerHTML = "";


        if (foods.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="7">
                        No food items found.
                    </td>
                </tr>
            `;

            return;

        }


        foods.forEach(function(food) {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>${food.id}</td>

                <td>${escapeHTML(food.name)}</td>

                <td>
                    ${escapeHTML(
                        food.description || ""
                    )}
                </td>

                <td>₹${Number(food.price).toFixed(2)}</td>

                <td>
                    ${escapeHTML(food.category || "")}
                </td>

                <td>

                    ${
                        food.available
                        ? '<span class="available">Available</span>'
                        : '<span class="unavailable">Unavailable</span>'
                    }

                </td>

                <td>

                    <div class="actions">

                        <button
                            class="edit-btn"
                            onclick="editFood(${food.id})"
                        >
                            ✏️ Edit
                        </button>

                        <button
                            class="availability-btn"
                            onclick="toggleAvailability(${food.id})"
                        >
                            ${
                                food.available
                                ? "❌ Disable"
                                : "✅ Enable"
                            }
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteFood(${food.id})"
                        >
                            🗑️ Delete
                        </button>

                    </div>

                </td>

            `;


            tbody.appendChild(row);

        });

    }


    // ==========================================
    // UPDATE DASHBOARD
    // ==========================================

    function updateDashboard() {

        const total =
            foods.length;

        const available =
            foods.filter(
                food => food.available
            ).length;

        const unavailable =
            total - available;


        document.getElementById(
            "totalFoods"
        ).textContent = total;


        document.getElementById(
            "availableFoods"
        ).textContent = available;


        document.getElementById(
            "unavailableFoods"
        ).textContent = unavailable;

    }


    // ==========================================
    // SAVE FOOD
    // ==========================================

    async function saveFood() {

        const name =
            document.getElementById(
                "foodName"
            ).value.trim();


        const price =
            Number(
                document.getElementById(
                    "foodPrice"
                ).value
            );


        const category =
            document.getElementById(
                "foodCategory"
            ).value;


        const available =
            document.getElementById(
                "foodAvailable"
            ).value === "true";


        const description =
            document.getElementById(
                "foodDescription"
            ).value.trim();


        if (!name) {

            showMessage(
                "Please enter food name.",
                "error"
            );

            return;

        }


        if (!price || price <= 0) {

            showMessage(
                "Please enter a valid price.",
                "error"
            );

            return;

        }


        if (!category) {

            showMessage(
                "Please select a category.",
                "error"
            );

            return;

        }


        const foodData = {

            name: name,

            description: description,

            price: price,

            category: category,

            available: available

        };


        try {

            let url = "/api/admin/foods";

            let method = "POST";


            if (editingFoodId !== null) {

                url =
                    "/api/admin/foods/" +
                    editingFoodId;

                method = "PUT";

            }


            const response =
                await fetch(
                    url,
                    {
                        method: method,

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                foodData
                            )
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.detail ||
                    "Could not save food."
                );

            }


            showMessage(
                result.message ||
                "Food saved successfully.",
                "success"
            );


            clearForm();

            await loadFoods();


        } catch (error) {

            showMessage(
                error.message,
                "error"
            );

        }

    }


    // ==========================================
    // EDIT FOOD
    // ==========================================

    function editFood(id) {

        const food =
            foods.find(
                item => item.id === id
            );


        if (!food) {
            return;
        }


        editingFoodId = id;


        document.getElementById(
            "foodName"
        ).value = food.name;


        document.getElementById(
            "foodPrice"
        ).value = food.price;


        document.getElementById(
            "foodCategory"
        ).value = food.category;


        document.getElementById(
            "foodAvailable"
        ).value =
            food.available
            ? "true"
            : "false";


        document.getElementById(
            "foodDescription"
        ).value =
            food.description || "";


        document.getElementById(
            "formTitle"
        ).textContent =
            "✏️ Edit Food";


        document.getElementById(
            "saveBtn"
        ).textContent =
            "💾 Update Food";


        document.getElementById(
            "saveBtn"
        ).className =
            "update-btn";


        document.getElementById(
            "cancelEditBtn"
        ).style.display =
            "inline-block";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    // ==========================================
    // CANCEL EDIT
    // ==========================================

    function cancelEdit() {

        editingFoodId = null;

        clearForm();

    }


    // ==========================================
    // CLEAR FORM
    // ==========================================

    function clearForm() {

        document.getElementById(
            "foodName"
        ).value = "";


        document.getElementById(
            "foodPrice"
        ).value = "";


        document.getElementById(
            "foodCategory"
        ).value = "";


        document.getElementById(
            "foodAvailable"
        ).value = "true";


        document.getElementById(
            "foodDescription"
        ).value = "";


        document.getElementById(
            "formTitle"
        ).textContent =
            "➕ Add New Food";


        document.getElementById(
            "saveBtn"
        ).textContent =
            "➕ Add Food";


        document.getElementById(
            "saveBtn"
        ).className =
            "add-btn";


        document.getElementById(
            "cancelEditBtn"
        ).style.display =
            "none";


        editingFoodId = null;

    }


    // ==========================================
    // TOGGLE AVAILABILITY
    // ==========================================

    async function toggleAvailability(id) {

        const food =
            foods.find(
                item => item.id === id
            );


        if (!food) {
            return;
        }


        try {

            const response =
                await fetch(
                    "/api/admin/foods/" +
                    id +
                    "/availability",
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                available:
                                    !food.available
                            })
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.detail ||
                    "Could not update availability."
                );

            }


            showMessage(
                result.message ||
                "Availability updated.",
                "success"
            );


            await loadFoods();


        } catch (error) {

            showMessage(
                error.message,
                "error"
            );

        }

    }


    // ==========================================
    // DELETE FOOD
    // ==========================================

    async function deleteFood(id) {

        const food =
            foods.find(
                item => item.id === id
            );


        if (!food) {
            return;
        }


        const confirmed =
            confirm(
                "Are you sure you want to delete " +
                food.name +
                "?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    "/api/admin/foods/" + id,
                    {
                        method: "DELETE"
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.detail ||
                    "Could not delete food."
                );

            }


            showMessage(
                result.message ||
                "Food deleted successfully.",
                "success"
            );


            await loadFoods();


        } catch (error) {

            showMessage(
                error.message,
                "error"
            );

        }

    }


    // ==========================================
    // MESSAGE
    // ==========================================

    function showMessage(
        message,
        type
    ) {

        const box =
            document.getElementById(
                "message"
            );


        box.textContent = message;

        box.className = type;

        box.style.display = "block";


        setTimeout(function() {

            box.style.display = "none";

        }, 3000);

    }


    // ==========================================
    // ESCAPE HTML
    // ==========================================

    function escapeHTML(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // ==========================================
    // START
    // ==========================================

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            loadFoods();

        }
    );

</script>

</body>
</html>
